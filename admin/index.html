<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="emergency-origin" content="https://functions.yandexcloud.net/d4el0c9fdaprakf7lnal">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://functions.yandexcloud.net; base-uri 'none'; form-action 'none'">
  <title>Администрирование · ArcPass</title>
  <link rel="stylesheet" href="../site.css?v=feedback-1">
  <script src="./admin.js?v=neutral-1" defer></script>
</head>
<body>
  <main class="emergency-admin">
    <h1>Администрирование ArcPass</h1>
    <p><a class="button" id="control-panel" href="https://194.226.139.8/admin/login">Открыть админку</a></p>
    <p>Пользователи, ссылки и заявки на замену VPN-серверов.</p>
    <h2>Временный резерв Aeza</h2>
    <p id="status" role="status">Подключаемся к контроллеру…</p>
    <form id="launch" method="post">
      <fieldset id="launch-fields" disabled>
        <label>Время работы, часов
          <input name="hours" type="number" min="1" max="24" value="3" required>
        </label>
        <label>Пароль запуска
          <input name="password" type="password" autocomplete="current-password" maxlength="512" required>
        </label>
        <button type="submit">Запустить резерв</button>
      </fieldset>
    </form>
    <p id="launch-feedback" class="action-feedback" role="status"></p>
    <p><a href="../">Кабинет пользователя</a></p>
  </main>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="emergency-origin" content="https://d5db0u2fsn83cajoa4a8.fovt0b64.apigw.yandexcloud.net">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://d5db0u2fsn83cajoa4a8.fovt0b64.apigw.yandexcloud.net; base-uri 'none'; form-action 'none'">
  <title>Запуск резерва · ArcPass</title>
  <link rel="stylesheet" href="../site.css">
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="emergency-admin">
    <h1>Запуск резерва</h1>
    <p id="status" role="status">Подключаемся к контроллеру…</p>
    <p id="launch-feedback" role="alert" hidden></p>
    <form id="launch" method="post">
      <fieldset id="launch-fields" disabled>
        <label>Срок аренды, часов
          <input name="hours" type="number" min="1" max="24" value="3" required>
        </label>
        <label>Пароль запуска
          <input name="password" type="password" autocomplete="current-password" maxlength="512" required>
        </label>
        <button type="submit">Запустить резерв</button>
      </fieldset>
    </form>
    <p><a href="../">Кабинет пользователя</a></p>
  </main>
</body>
</html>
